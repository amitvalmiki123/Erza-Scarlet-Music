name: Build Chess Sikho APK

on:
  workflow_dispatch:
  push:
    branches: [ arena/e5d474ac-erza-scarlet-music, main ]
    paths:
      - 'chess-sikho/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Android APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('chess-sikho/android/**/*.gradle', 'chess-sikho/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs
        working-directory: chess-sikho/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease
          echo "--- outputs ---"
          find app/build/outputs/apk -name '*.apk' -print

      - name: Collect and rename APKs
        run: |
          mkdir -p dist
          cp chess-sikho/android/app/build/outputs/apk/release/app-release.apk dist/ChessSikho.apk
          cp chess-sikho/android/app/build/outputs/apk/debug/app-debug.apk dist/ChessSikho-debug.apk
          ls -lh dist
          # version info for the release notes
          (cd chess-sikho/android && sha256sum ../../dist/ChessSikho.apk > ../../dist/SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessSikho-APK
          path: |
            dist/ChessSikho.apk
            dist/ChessSikho-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release (latest APK)
        if: github.ref == 'refs/heads/arena/e5d474ac-erza-scarlet-music' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v1.0"
          NOTES="Chess Sikho — offline Hinglish chess coach APK.

**Install kaise karein**
1. Neeche se \`ChessSikho.apk\` download karo (phone me).
2. Download kholo — Android bolega \"Unknown sources allow karo\" → Settings me allow kar do.
3. Install → app kholo. Internet ki zaroorat nahi hai.

**Kya milta hai**
- 🧠 Coach: har position pe best move + **kyu** (Hinglish), jeetne ki probability
- 🔊 Voice guide: guide bol ke sunata hai (native Android TTS)
- 🎯 Opponent ki expected chaalein probability ke saath + unka jawab
- ⚠️ Threat alert: kaunsa piece free me ja raha hai
- 📖 Opening book: Italian, London, Caro-Kann, Sicilian… plan aur trap ke saath
- 📚 15 Hinglish lessons + 8 mate-in-1 puzzles
- ♟️ 4 level ka bot, undo, hint, flip

Build: ${{ github.sha }}
"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ChessSikho.apk dist/ChessSikho-debug.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/ChessSikho.apk dist/ChessSikho-debug.apk dist/SHA256SUMS.txt \
              --title "Chess Sikho APK v1.0" --notes "$NOTES"
          fi
