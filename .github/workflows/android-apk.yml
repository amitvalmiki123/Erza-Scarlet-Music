name: Build Chess Sikho APK

on:
  workflow_dispatch:
  push:
    branches: [ arena/e5d474ac-erza-scarlet-music, main ]
    paths:
      - 'chess-sikho/**'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/apk-release-notes.md'

permissions:
  contents: write

jobs:
  apk:
    name: Android APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner pe Android SDK pehle se installed hota hai —
      # bas zaroori packages ensure kar lo.
      - name: Ensure Android SDK packages
        run: |
          set -x
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} / ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager nahi mila — AGP khud download kar lega (licenses already accepted)."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('chess-sikho/android/**/*.gradle', 'chess-sikho/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs
        working-directory: chess-sikho/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease
          echo "--- outputs ---"
          find app/build/outputs/apk -name '*.apk' -print

      - name: Verify APK contents (assets + manifest)
        run: |
          set -e
          APK=chess-sikho/android/app/build/outputs/apk/release/app-release.apk
          echo "== APK size =="
          ls -lh "$APK"
          echo "== assets inside APK =="
          unzip -l "$APK" | grep 'assets/' || { echo 'FATAL: web assets APK me nahi gayi'; exit 1; }
          echo "== required files check =="
          for f in index.html app.js engine.js ai.js analyzer.js coach.js openings.js voice.js storage.js board.js lessons.js styles.css; do
            unzip -l "$APK" | grep -q "assets/$f" || { echo "FATAL: assets/$f missing"; exit 1; }
            echo "  ok assets/$f"
          done
          echo "== signing =="
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -5

      - name: Collect and rename APKs
        run: |
          mkdir -p dist
          cp chess-sikho/android/app/build/outputs/apk/release/app-release.apk dist/ChessSikho.apk
          cp chess-sikho/android/app/build/outputs/apk/debug/app-debug.apk dist/ChessSikho-debug.apk
          sed "s/{SHA}/${GITHUB_SHA}/" .github/workflows/apk-release-notes.md > dist/RELEASE_NOTES.md
          (cd dist && sha256sum ChessSikho.apk ChessSikho-debug.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessSikho-APK
          path: |
            dist/ChessSikho.apk
            dist/ChessSikho-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="chess-sikho-apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/ChessSikho.apk dist/ChessSikho-debug.apk dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/ChessSikho.apk dist/ChessSikho-debug.apk dist/SHA256SUMS.txt --title "Chess Sikho APK (offline Hinglish chess coach)" --notes-file dist/RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
